services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env or the shell}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  db-init:
    build:
      context: .
      dockerfile: docker/db-init/Dockerfile
    image: hoteldesk-db-init:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env or the shell}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  hoteldesk:
    build:
      context: .
      dockerfile: Dockerfile
    image: hoteldesk:latest
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Hotel: Server=db;Database=QL_KhachSan;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env or the shell};Encrypt=False;TrustServerCertificate=True
      ConnectionStrings__HotelDemo: Server=db;Database=QL_KhachSan;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env or the shell};Encrypt=False;TrustServerCertificate=True
      Demo__Enabled: ${DEMO_ENABLED:-false}
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mssql_data:
